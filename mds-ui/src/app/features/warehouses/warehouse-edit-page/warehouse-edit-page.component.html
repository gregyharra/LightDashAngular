<section class="warehouse-edit">
  <ld-page-frame>
    <nav
      class="warehouse-edit__breadcrumbs"
      [attr.aria-label]="'common.breadcrumb' | translate"
    >
      <a routerLink="/projects" class="warehouse-edit__breadcrumb-link">{{
        "nav.home" | translate
      }}</a>
      <mat-icon>chevron_right</mat-icon>
      <a
        routerLink="/settings/warehouses"
        class="warehouse-edit__breadcrumb-link"
        >{{ "warehouses.title" | translate }}</a
      >
      <mat-icon>chevron_right</mat-icon>
      <span class="warehouse-edit__breadcrumb-current">
        @if (isCreateMode()) {
          {{ "warehouses.createVerb" | translate }}
        } @else {
          {{ "warehouses.editVerb" | translate }}
        }
      </span>
    </nav>

    <ld-page-header
      [title]="
        (isCreateMode() ? 'warehouses.create' : 'warehouses.edit') | translate
      "
      [subtitle]="'warehouses.editSubtitle' | translate"
    />

    <app-warehouse-form
      [mode]="isCreateMode() ? 'create' : 'edit'"
      [warehouseUuid]="warehouseUuid()"
      (saved)="onSaved()"
      (cancelled)="onCancelled()"
    />
  </ld-page-frame>
</section>
