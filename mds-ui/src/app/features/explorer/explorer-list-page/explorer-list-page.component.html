<div class="page-layout">
  <aside class="page-layout__sidebar" appResizableSidebar>
    <div class="page-sidebar page-sidebar--dark">
      @if (projectUuid(); as browseProjectUuid) {
        <app-project-browse-nav
          [projectUuid]="browseProjectUuid"
          active="tables"
        />
      }
    </div>
  </aside>

  <div class="page-layout__content">
    <section class="explorer-list">
      <ld-page-frame [wide]="true">
        <nav
          class="explorer-list__breadcrumbs"
          [attr.aria-label]="'charts.breadcrumb' | translate"
        >
          <a routerLink="/projects" class="explorer-list__breadcrumb-link">
            {{ "nav.home" | translate }}
          </a>
          <mat-icon>chevron_right</mat-icon>
          <span class="explorer-list__breadcrumb-current">{{
            "tables.title" | translate
          }}</span>
        </nav>

        <ld-page-header
          [title]="'tables.title' | translate"
          [subtitle]="'explorer.selectModelToQuery' | translate"
        />

        @if (loading()) {
          <div class="explorer-list__loading">
            <mat-spinner diameter="32" />
          </div>
        } @else if (error()) {
          <div class="explorer-list__error">{{ error() }}</div>
        } @else if (explores().length === 0) {
          <ld-empty-state
            icon="table_chart"
            [title]="'explorer.noExplores' | translate"
          />
        } @else {
          <div class="explorer-list__grid">
            @for (explore of explores(); track explore.name) {
              <button
                type="button"
                class="explorer-list__card"
                (click)="openExplore(explore.name)"
              >
                <div class="explorer-list__card-icon">
                  <mat-icon>table_chart</mat-icon>
                </div>
                <div class="explorer-list__card-body">
                  <span class="explorer-list__card-name">{{
                    explore.label
                  }}</span>
                  @if (explore.description) {
                    <span class="explorer-list__card-description">{{
                      explore.description
                    }}</span>
                  }
                  <span class="explorer-list__card-meta">
                    {{ explore.databaseName }}.{{ explore.schemaName }}
                  </span>
                  @if (explore.tags.length > 0) {
                    <div class="explorer-list__card-tags">
                      @for (tag of explore.tags; track tag) {
                        <span class="explorer-list__tag">{{ tag }}</span>
                      }
                    </div>
                  }
                </div>
                <mat-icon class="explorer-list__card-chevron"
                  >chevron_right</mat-icon
                >
              </button>
            }
          </div>
        }
      </ld-page-frame>
    </section>
  </div>
</div>
