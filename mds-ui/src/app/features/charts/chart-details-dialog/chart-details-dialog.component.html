<h2 mat-dialog-title>Edit chart details</h2>

<mat-dialog-content class="chart-details-dialog__content">
  <mat-form-field
    appearance="outline"
    class="chart-details-dialog__field"
    subscriptSizing="dynamic"
  >
    <mat-label>Chart name</mat-label>
    <input matInput [(ngModel)]="name" maxlength="120" autofocus />
  </mat-form-field>

  <mat-form-field
    appearance="outline"
    class="chart-details-dialog__field"
    subscriptSizing="dynamic"
  >
    <mat-label>Description</mat-label>
    <textarea
      matInput
      [(ngModel)]="description"
      maxlength="280"
      rows="3"
    ></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="!canApply"
    (click)="apply()"
  >
    Apply
  </button>
</mat-dialog-actions>
