<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-card__title">Sign in</h1>
    <p class="auth-card__subtitle">Sign in to continue to your workspace.</p>

    <mat-form-field appearance="outline" class="auth-card__full">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="auth-card__full">
      <mat-label>Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
    </mat-form-field>

    @if (error()) {
      <p class="auth-card__error">{{ error() }}</p>
    }

    <button mat-flat-button color="primary" type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <p class="auth-card__hint">
      Forgot your password? Ask an admin to reset it — they will give you a reset link
      (or a temporary password that requires choosing a new one).
    </p>
  </form>
</div>
