<div class="auth-page">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="auth-card__title">{{ 'auth.signInTitle' | translate }}</h1>
    <p class="auth-card__subtitle">{{ 'auth.signInSubtitle' | translate }}</p>

    <mat-form-field appearance="outline" class="auth-card__full">
      <mat-label>{{ 'auth.email' | translate }}</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="username" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="auth-card__full">
      <mat-label>{{ 'auth.password' | translate }}</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="current-password" />
    </mat-form-field>

    @if (error()) {
      <p class="auth-card__error">{{ error() }}</p>
    }

    <ld-button type="submit" [disabled]="submitting()">
      {{ (submitting() ? 'auth.signingIn' : 'auth.signIn') | translate }}
    </ld-button>

    <p class="auth-card__hint">
      {{ 'auth.forgotHint' | translate }}
    </p>
  </form>
</div>
