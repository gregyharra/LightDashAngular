<div class="page-layout">
  <aside class="page-layout__sidebar" appResizableSidebar>
    <div class="page-sidebar">
      <header class="page-sidebar__header">
        <p class="page-sidebar__breadcrumb">Settings</p>
      </header>
      <app-settings-sidebar-nav active="users" />
    </div>
  </aside>

  <div class="page-layout__content">
    <section class="users">
      <div class="page__container">
        <header class="users__header">
          <div class="users__title-block">
            <h1 class="users__title">Users</h1>
            <p class="users__subtitle">Create and manage workspace users.</p>
          </div>
          <button mat-flat-button class="users__create-btn" type="button" (click)="openCreate()">
            <mat-icon>person_add</mat-icon>
            Create user
          </button>
        </header>

        @if (loading()) {
          <div class="users__loading">
            <mat-spinner diameter="32" />
          </div>
        } @else if (error()) {
          <div class="users__error">{{ error() }}</div>
        } @else {
          <table mat-table [dataSource]="users()" class="users__table">
            <ng-container matColumnDef="name">
              <th mat-header-cell *matHeaderCellDef>Name</th>
              <td mat-cell *matCellDef="let user">{{ user.firstName }} {{ user.lastName }}</td>
            </ng-container>
            <ng-container matColumnDef="email">
              <th mat-header-cell *matHeaderCellDef>Email</th>
              <td mat-cell *matCellDef="let user">{{ user.email }}</td>
            </ng-container>
            <ng-container matColumnDef="role">
              <th mat-header-cell *matHeaderCellDef>Role</th>
              <td mat-cell *matCellDef="let user">{{ user.role }}</td>
            </ng-container>
            <ng-container matColumnDef="status">
              <th mat-header-cell *matHeaderCellDef>Status</th>
              <td mat-cell *matCellDef="let user">
                {{ user.isActive ? 'Active' : 'Inactive' }}
              </td>
            </ng-container>
            <ng-container matColumnDef="actions">
              <th mat-header-cell *matHeaderCellDef></th>
              <td mat-cell *matCellDef="let user">
                <button mat-button type="button" (click)="resetPassword(user)">Reset password</button>
                @if (user.isActive) {
                  <button mat-button type="button" (click)="deactivate(user)">Deactivate</button>
                }
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
          </table>
        }
      </div>
    </section>
  </div>
</div>
