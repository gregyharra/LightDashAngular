<div class="shell">
  <dpf-app-topbar id="navbar-header">
    <dpf-brand-mark
      dpfBrand
      [title]="'nav.home' | translate"
      [ariaLabel]="'nav.brandName' | translate"
      [lead]="'nav.brandNameLead' | translate"
      [trail]="'nav.brandNameTrail' | translate"
    />
    @if (activeProjectService.activeProject()) {
      <app-navbar-search dpfCenter />
    } @else {
      <div dpfCenter class="shell__navbar-spacer"></div>
    }

    <div dpfActions class="shell__navbar-actions">
      @if (activeProjectService.activeProjectUuid()) {
        <app-navbar-project-switcher />
      }
      @if (askAiEnabled()) {
        <dpf-icon-button
          icon="auto_awesome"
          tone="ai"
          [ariaLabel]="'nav.askAi' | translate"
          (click)="openAiAssistant()"
        />
      }
      @if (showHelp) {
        <dpf-icon-button
          icon="help_outline"
          [disabled]="true"
          [ariaLabel]="'nav.help' | translate"
        />
      }
      @if (showNotifications) {
        <span class="shell__notification-action">
          <dpf-icon-button
            icon="notifications_none"
            [disabled]="true"
            [ariaLabel]="'nav.notifications' | translate"
          />
          <span class="shell__notification-dot"></span>
        </span>
      }
      <app-navbar-user-menu />
    </div>
  </dpf-app-topbar>

  <main class="shell__content">
    <router-outlet />
  </main>
  @if (askAiEnabled()) {
    <app-ai-assistant-panel />
  }
</div>
